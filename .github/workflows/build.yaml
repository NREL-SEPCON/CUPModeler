name: Build and Release CUP Modeler

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.11']
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Create launcher script
      run: |
        cat > launcher.py << 'EOF'
        import sys
        import os

        # Add Scripts directory to path
        scripts_dir = os.path.join(os.path.dirname(__file__), "Python Version", "Scripts")
        sys.path.insert(0, scripts_dir)

        # Change to Scripts directory for relative paths to work
        os.chdir(scripts_dir)

        # Import and run the app
        if __name__ == "__main__":
            from app.main import main
            main()
        EOF
    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk
    
    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --windowed --name="CUP-Modeler-Windows" --icon="Python Version/Scripts/icon.ico" --add-data="Python Version/Scripts/models;models" --add-data="Python Version/Scripts/app;app" --collect-all numpy --collect-all scipy --collect-all matplotlib --collect-all pandas --hidden-import=numba.core.types.scalars --hidden-import=scipy.special._ufuncs_cxx --hidden-import=matplotlib.backends.backend_tkagg --exclude-module=pytest --exclude-module=IPython --exclude-module=jupyter --exclude-module=sphinx --exclude-module=pytz launcher.py
    
    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --onefile --windowed --name="CUP-Modeler-macOS" --icon="Python Version/Scripts/icon.ico" --add-data="Python Version/Scripts/models:models" --add-data="Python Version/Scripts/app:app" --collect-all numpy --collect-all scipy --collect-all matplotlib --collect-all pandas --hidden-import=numba.core.types.scalars --hidden-import=scipy.special._ufuncs_cxx --hidden-import=matplotlib.backends.backend_tkagg --exclude-module=pytest --exclude-module=IPython --exclude-module=jupyter --exclude-module=sphinx --exclude-module=pytz launcher.py
    
    - name: Build with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --onefile --windowed --name="CUP-Modeler-Linux" --add-data="Python Version/Scripts/models:models" --add-data="Python Version/Scripts/app:app" --collect-all numpy --collect-all scipy --collect-all matplotlib --collect-all pandas --hidden-import=numba.core.types.scalars --hidden-import=scipy.special._ufuncs_cxx --hidden-import=matplotlib.backends.backend_tkagg --exclude-module=pytest --exclude-module=IPython --exclude-module=jupyter --exclude-module=sphinx --exclude-module=pytz launcher.py
    
    - name: Create application bundle (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Create .app bundle structure
        mkdir -p "CUP Modeler.app/Contents/MacOS"
        mkdir -p "CUP Modeler.app/Contents/Resources"
        
        # Copy executable
        cp "dist/CUP-Modeler-macOS" "CUP Modeler.app/Contents/MacOS/CUP Modeler"
        chmod +x "CUP Modeler.app/Contents/MacOS/CUP Modeler"
        
        # Create Info.plist
        cat > "CUP Modeler.app/Contents/Info.plist" << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>CUP Modeler</string>
            <key>CFBundleIdentifier</key>
            <string>com.yourorganization.cupmodeler</string>
            <key>CFBundleName</key>
            <string>CUP Modeler</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
        </dict>
        </plist>
        EOF
        
        # Create DMG
        hdiutil create -volname "CUP Modeler" -srcfolder "CUP Modeler.app" -ov -format UDZO "CUP-Modeler-macOS.dmg"
    
    - name: Prepare artifacts
      shell: bash
      run: |
        mkdir -p artifacts
        
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          cp dist/CUP-Modeler-Windows.exe artifacts/
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          cp CUP-Modeler-macOS.dmg artifacts/
          cp dist/CUP-Modeler-macOS artifacts/
        elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          cp dist/CUP-Modeler-Linux artifacts/
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: CUP-Modeler-${{ matrix.os }}
        path: artifacts/
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run tests (if they exist)
      run: |
        cd "Python Version/Scripts"
        # Test if the app module can be imported
        python -c "import sys; sys.path.append('.'); from app.main import main; print('App imports successfully')" || echo "App import test failed"
        
        # Only run tests if test files exist
        if [ -d "tests" ] || [ -f "test_*.py" ]; then
          python -m pytest tests/ -v || echo "No tests found or tests failed"
        else
          echo "No tests directory found, skipping tests"
        fi